services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast-ocr:local
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-fast-ocr}
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8000
    restart: unless-stopped
