services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast-ocr:local
    user: "1000:1000"
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-fast-ocr}
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped
